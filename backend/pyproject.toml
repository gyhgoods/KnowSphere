[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowsphere-backend"
version = "0.1.0"
requires-python = "==3.12.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "redis>=5.2,<6",
  "minio>=7.2,<8",
  "celery>=5.5,<6",
  "pypdf>=5.6,<6",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pgvector>=0.4,<1",
  "structlog>=25.2,<26",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
